<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Musiorganolog</title>

  <!-- Arka plan -->
  <circle cx="32" cy="32" r="32" fill="#0a0e1a"/>

  <!-- Dış dekoratif halka -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- 5 ana dal — her biri 72° aralıkla (kordofonlar, aerofonlar, idiofonlar, membranofonlar, elektrofonlar) -->
  <!-- Dal 1 — üst (−90°) -->
  <line x1="32" y1="32" x2="32" y2="10"    stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="32" cy="10"  r="2.8" fill="#d4af37" fill-opacity="0.9"/>

  <!-- Dal 2 — sağ üst (−18°) -->
  <line x1="32" y1="32" x2="52.9" y2="18.9" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="52.9" cy="18.9" r="2.8" fill="#d4af37" fill-opacity="0.9"/>

  <!-- Dal 3 — sağ alt (54°) -->
  <line x1="32" y1="32" x2="44.9" y2="51.1" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="44.9" cy="51.1" r="2.8" fill="#d4af37" fill-opacity="0.9"/>

  <!-- Dal 4 — sol alt (126°) -->
  <line x1="32" y1="32" x2="19.1" y2="51.1" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="19.1" cy="51.1" r="2.8" fill="#d4af37" fill-opacity="0.9"/>

  <!-- Dal 5 — sol üst (198°) -->
  <line x1="32" y1="32" x2="11.1" y2="18.9" stroke="#d4af37" stroke-width="1.4" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="11.1" cy="18.9" r="2.8" fill="#d4af37" fill-opacity="0.9"/>

  <!-- İkinci katman — her daldan 2 alt dal -->
  <!-- Dal 1 alt dallar -->
  <line x1="32" y1="10" x2="27" y2="5"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="37" y2="5"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Dal 2 alt dallar -->
  <line x1="52.9" y1="18.9" x2="57" y2="14"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="52.9" y1="18.9" x2="58" y2="22"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Dal 3 alt dallar -->
  <line x1="44.9" y1="51.1" x2="50" y2="55"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="44.9" y1="51.1" x2="44" y2="58"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Dal 4 alt dallar -->
  <line x1="19.1" y1="51.1" x2="14" y2="56"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="19.1" y1="51.1" x2="20" y2="58"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Dal 5 alt dallar -->
  <line x1="11.1" y1="18.9" x2="6"  y2="22"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>
  <line x1="11.1" y1="18.9" x2="7"  y2="14"  stroke="#c9a94e" stroke-width="0.9" stroke-opacity="0.65" stroke-linecap="round"/>

  <!-- Merkez — altın yuvarlak + parlaklık halkası -->
  <circle cx="32" cy="32" r="5.5" fill="#0a0e1a" stroke="#d4af37" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="3.2" fill="#d4af37"/>
</svg>
